name = "farmilky-backend"
main = "worker.js"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]
# nodejs_compat is the runtime default for this date, but must also be listed
# explicitly so Wrangler tells esbuild to use Node.js module resolution conditions
# during bundling — without it, esbuild picks mongoose's browser bundle.

[vars]
NODE_ENV = "production"

[triggers]
crons = [
  "0 0 * * *",   # daily delivery + manifest generation (midnight)
  "0 21 * * *",  # end-of-day manifest close (9 PM)
  "0 1 1 * *",   # monthly invoice generation (1 AM on 1st)
]
